name: CI

on:
  push: # на все ветки, а не только main — фиче-работа проверяется до мержа
  pull_request:

# Отменять устаревшие run'ы того же ref при новом пуше (экономия минут).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Typecheck
        run: uv run mypy

      # Список падений дублируется в annotations и job summary: логи шага
      # видны только авторизованным, а эти два канала — всем, кому доступен
      # репозиторий (и переживают ротацию логов).
      - name: Tests
        run: |
          set -o pipefail
          uv run pytest -q --tb=short 2>&1 | tee /tmp/pytest.log || {
            grep -E '^(FAILED|ERROR)' /tmp/pytest.log | sed 's/^/::error::/'
            {
              echo '### Падения pytest'
              echo '```'
              grep -E '^(FAILED|ERROR)' /tmp/pytest.log || tail -60 /tmp/pytest.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Evals (MVP criteria §26)
        run: uv run pytest evals

      # Клиент (план 2026-07-27): Node нужен только для сборки бандла,
      # запуск Сварога его не требует.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        run: npm --prefix web ci

      - name: Web typecheck and tests
        run: npm --prefix web test

      - name: Web build
        run: npm --prefix web run build

      # Колесо собирается только здесь — после бандла. Шаг стережёт обратный
      # путь: `uv sync` выше проверяет сборку без клиента, этот — с клиентом
      # (бандл должен попасть внутрь пакета, см. hatch_build.py).
      - name: Package build
        run: |
          uv build --wheel
          unzip -l dist/*.whl | grep -q 'svarog_harness/gateway/web/index.html'
